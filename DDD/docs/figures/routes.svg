/><rect class="lbg" x="135.9" y="83.1" width="14.3" height="13" rx="2"/><text class="lb c-acl" x="143.1" y="93.6" text-anchor="middle">f</text><rect class="lbg" x="278.3" y="82.4" width="14.3" height="13" rx="2"/><text class="lb c-acl" x="285.4" y="92.9" text-anchor="middle">g</text><rect class="lbg" x="132.8" y="158.9" width="20.6" height="13" rx="2"/><text class="lb c-acl" x="143.1" y="169.4" text-anchor="middle">f&#x27;</text><rect class="lbg" x="275.1" y="159.6" width="20.6" height="13" rx="2"/><text class="lb c-acl" x="285.4" y="170.1" text-anchor="middle">g&#x27;</text><rect class="lbg" x="545.9" y="83.1" width="14.3" height="13" rx="2"/><text class="lb c-acl" x="553.1" y="93.6" text-anchor="middle">f</text><rect class="lbg" x="688.3" y="82.4" width="14.3" height="13" rx="2"/><text class="lb c-acl" x="695.4" y="92.9" text-anchor="middle">g</text><rect class="lbg" x="542.8" y="158.9" width="20.6" height="13" rx="2"/><text class="lb c-acl" x="553.1" y="169.4" text-anchor="middle">f&#x27;</text><rect class="lbg" x="685.1" y="159.6" width="20.6" height="13" rx="2"/><text class="lb c-acl" x="695.4" y="170.1" text-anchor="middle">g&#x27;</text><text class="mono acc" x="215.0" y="126.0" text-anchor="middle">p = f ≫ g</text><text class="mono acc" x="215.0" y="141.0" text-anchor="middle">q = f&#x27; ≫ g&#x27;</text><text class="mono acc" x="215.0" y="228.0" text-anchor="middle">coherent: D.map p = D.map q</text><text class="mono" x="625.0" y="126.0" text-anchor="middle">p ≠ q in J</text><text class="mono m" x="625.0" y="228.0" text-anchor="middle">y ↦ D p y and D q y: two references</text></svg>
