<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" role="img" aria-label="The translation CatalogPL to Orders sends both entity types to Product and each generator to a path; a translation that breaks an equation fails the check."><style>svg { --surface: #ffffff; --region: #f3f5f8; --fg: #1b232c; --muted: #5a6675; --line: #c9d1da; --accent: #17708f; --accentfill: rgba(23,112,143,0.10); --kern: #2f7a4b; --kernfill: rgba(47,122,75,0.10); --warn: #b4421b; --warnfill: rgba(180,66,27,0.08); } @media (prefers-color-scheme: dark) { svg { --surface: #19212a; --region: #202a35; --fg: #e3e9ef; --muted: #9aa7b5; --line: #34414f; --accent: #5db4d3; --accentfill: rgba(93,180,211,0.14); --kern: #6cc28d; --kernfill: rgba(108,194,141,0.13); --warn: #f08c5e; --warnfill: rgba(240,140,94,0.11); } }
.bgr { fill: var(--surface); }
.n rect { fill: var(--surface); stroke: var(--fg); stroke-width: 1.2; }
.n.pl rect { fill: var(--accentfill); stroke: var(--accent); stroke-width: 1.5; }
.n.kern rect { fill: var(--kernfill); stroke: var(--kern); stroke-width: 1.5; }
.n.glued rect { fill: var(--kernfill); stroke: var(--kern); stroke-width: 1.5; }
.n.muted rect { fill: var(--surface); stroke: var(--muted); stroke-dasharray: 4 3; }
.n.warn rect { fill: var(--warnfill); stroke: var(--warn); stroke-width: 1.5; stroke-dasharray: 4 3; }
.n.val rect { fill: var(--region); stroke: var(--muted); }
.n.chip rect { fill: var(--surface); stroke: var(--muted); }
.n.chip.s rect { fill: var(--accentfill); stroke: var(--accent); }
.n.dot rect { fill: var(--region); stroke: var(--muted); }
.n .t { fill: var(--fg); font: 500 12.5px 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; }
.n .s { fill: var(--muted); font: 400 10.5px 'IBM Plex Mono', ui-monospace, Menlo, monospace; }
.n .a { fill: var(--fg); font: 400 10.5px 'IBM Plex Mono', ui-monospace, Menlo, monospace; }
.n.chip .t, .n.val .t, .n.dot .t { font: 400 11.5px 'IBM Plex Mono', ui-monospace, Menlo, monospace; }
.n .hr { stroke: var(--line); stroke-width: 1; }
.badge { font: 500 10px 'IBM Plex Mono', ui-monospace, Menlo, monospace; }
.b-pl { fill: var(--accent); } .b-kern { fill: var(--kern); } .b-warn { fill: var(--warn); }
.b-muted { fill: var(--muted); }
.e { fill: none; stroke-width: 1.4; }
.e.acl { stroke: var(--fg); }
.e.muted { stroke: var(--muted); }
.e.incl { stroke: var(--accent); stroke-dasharray: 6 4; }
.e.kern { stroke: var(--kern); stroke-dasharray: 6 4; stroke-width: 1.6; }
.e.eq { stroke: var(--accent); stroke-width: 2.2; }
.e.warn { stroke: var(--warn); stroke-width: 1.8; }
.e.ghost { stroke: var(--warn); stroke-dasharray: 3 3; }
.e.uniq { stroke: var(--fg); stroke-dasharray: 3 3; }
.e.map { stroke: var(--accent); stroke-dasharray: 2 3; stroke-width: 1.3; }
.e.glued { stroke: var(--kern); stroke-width: 1.6; }
.mk-acl, .mk-uniq { fill: var(--fg); } .mk-muted { fill: var(--muted); }
.mk-incl, .mk-eq, .mk-map { fill: var(--accent); } .mk-kern, .mk-glued { fill: var(--kern); }
.mk-warn, .mk-ghost { fill: var(--warn); }
.lbg { fill: var(--surface); }
.lb { font: 400 10.5px 'IBM Plex Mono', ui-monospace, Menlo, monospace; }
.c-acl, .c-muted, .c-uniq { fill: var(--muted); } .c-fg { fill: var(--fg); }
.c-incl, .c-eq, .c-map, .c-pl { fill: var(--accent); }
.c-kern, .c-glued { fill: var(--kern); } .c-warn, .c-ghost { fill: var(--warn); }
.rg { fill: var(--region); stroke: var(--line); }
.rg.pl { fill: var(--accentfill); stroke: var(--accent); stroke-dasharray: 3 3; }
.rg.kern { fill: var(--kernfill); stroke: var(--kern); stroke-dasharray: 3 3; }
.rg.warn { fill: var(--warnfill); stroke: var(--warn); stroke-dasharray: 3 3; }
.rg.plain { fill: none; stroke: var(--line); }
.rgl { font: 500 10.5px 'IBM Plex Mono', ui-monospace, Menlo, monospace; fill: var(--muted); letter-spacing: 0.04em; }
.rgl.pl { fill: var(--accent); } .rgl.kern { fill: var(--kern); } .rgl.warn { fill: var(--warn); }
.hull { fill: none; stroke: var(--fg); stroke-dasharray: 2 3; stroke-width: 1; }
.hl { font: 500 10.5px 'IBM Plex Mono', ui-monospace, Menlo, monospace; fill: var(--fg); }
.note { font: 400 11px 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; fill: var(--muted); }
.note.fg { fill: var(--fg); }
.mono { font: 400 11px 'IBM Plex Mono', ui-monospace, Menlo, monospace; fill: var(--fg); }
.mono.m { fill: var(--muted); } .mono.acc { fill: var(--accent); } .mono.warn { fill: var(--warn); }
.mono.kern { fill: var(--kern); }
.br { fill: none; stroke: var(--muted); stroke-width: 1; }
.br.acc { stroke: var(--accent); }
</style><defs><marker id="translation-acl" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-acl" d="M0,0 L10,5 L0,10 z"/></marker><marker id="translation-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-muted" d="M0,0 L10,5 L0,10 z"/></marker><marker id="translation-incl" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-incl" d="M0,0 L10,5 L0,10 z"/></marker><marker id="translation-kern" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-kern" d="M0,0 L10,5 L0,10 z"/></marker><marker id="translation-eq" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-eq" d="M0,0 L10,5 L0,10 z"/></marker><marker id="translation-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-warn" d="M0,0 L10,5 L0,10 z"/></marker><marker id="translation-ghost" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-ghost" d="M0,0 L10,5 L0,10 z"/></marker><marker id="translation-uniq" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-uniq" d="M0,0 L10,5 L0,10 z"/></marker><marker id="translation-map" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-map" d="M0,0 L10,5 L0,10 z"/></marker><marker id="translation-glued" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-glued" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bgr" width="820" height="500"/><rect class="rg pl" x="20" y="24" width="230" height="270" rx="8"/><text class="rgl pl" x="30" y="41">CATALOGPL</text><rect class="rg " x="570" y="24" width="230" height="270" rx="8"/><text class="rgl " x="580" y="41">ORDERS (PART)</text><rect class="rg warn" x="20" y="314" width="780" height="170" rx="8"/><text class="rgl warn" x="30" y="331">ORDERSPL → PAYMENTS WITH billTo ↦ [shipTo]: NOT VALID</text><g class="n pl"><rect x="55.0" y="59.0" width="160" height="58" rx="5"/><text class="t" x="135.0" y="76.0" text-anchor="middle">Variant</text><line class="hr" x1="55.0" y1="83.0" x2="215.0" y2="83.0"/><text class="a" x="63.0" y="97.0">sku : string</text><text class="a" x="63.0" y="111.0">price : decimal</text></g><g class="n pl"><rect x="55.0" y="193.0" width="160" height="44" rx="5"/><text class="t" x="135.0" y="210.0" text-anchor="middle">Product</text><line class="hr" x1="55.0" y1="217.0" x2="215.0" y2="217.0"/><text class="a" x="63.0" y="231.0">name : string</text></g><line class="e acl" x1="135.0" y1="119.5" x2="135.0" y2="189.0" marker-end="url(#translation-acl)"/><g class="n "><rect x="600.0" y="114.0" width="170" height="72" rx="5"/><text class="t" x="685.0" y="131.0" text-anchor="middle">Product</text><line class="hr" x1="600.0" y1="138.0" x2="770.0" y2="138.0"/><text class="a" x="608.0" y="152.0">sku : string</text><text class="a" x="608.0" y="166.0">name : string</text><text class="a" x="608.0" y="180.0">listPrice : decimal</text></g><g class="n muted"><rect x="625.0" y="235.0" width="120" height="26" rx="5"/><text class="t" x="685.0" y="252.5" text-anchor="middle">OrderLine</text></g><line class="e muted" x1="685.0" y1="232.5" x2="685.0" y2="190.0" marker-end="url(#translation-muted)"/><path class="e map" d="M217.5,90.1 Q412.7,95.2 596.0,132.1" marker-end="url(#translation-map)"/><path class="e map" d="M217.5,210.1 Q411.9,198.4 596.0,165.8" marker-end="url(#translation-map)"/><line class="e acl" x1="250.0" y1="372.0" x2="420.0" y2="372.0" marker-end="url(#translation-acl)"/><rect class="lbg" x="78.9" y="145.2" width="52.1" height="13" rx="2"/><text class="lb c-acl" x="127.0" y="155.8" text-anchor="end">product</text><rect class="lbg" x="323.4" y="77.1" width="115.1" height="13" rx="2"/><text class="lb c-map" x="380.9" y="87.6" text-anchor="middle">Variant ↦ Product</text><rect class="lbg" x="312.3" y="175.5" width="115.1" height="13" rx="2"/><text class="lb c-map" x="369.8" y="186.0" text-anchor="middle">Product ↦ Product</text><text class="rgl" x="410.0" y="222.0" text-anchor="middle">generator images</text><text class="mono" x="410.0" y="241.0" text-anchor="middle">product ↦ [ ]  (identity)</text><text class="mono" x="410.0" y="256.0" text-anchor="middle">price ↦ [listPrice]</text><text class="mono" x="410.0" y="271.0" text-anchor="middle">sku ↦ [sku]  (unlisted)</text><text class="mono" x="410.0" y="286.0" text-anchor="middle">name ↦ [name]  (unlisted)</text><text class="note" x="40.0" y="352.0" text-anchor="start">equation of OrdersPL, out of Order</text><text class="mono acc" x="40.0" y="376.0" text-anchor="start">billTo</text><text class="mono" x="100.0" y="376.0" text-anchor="start">=</text><text class="mono acc" x="118.0" y="376.0" text-anchor="start">customer.address</text><rect class="lbg" x="308.9" y="353.0" width="52.1" height="13" rx="2"/><text class="lb c-acl" x="335.0" y="363.5" text-anchor="middle">mapPath</text><text class="note" x="440.0" y="352.0" text-anchor="start">image out of Invoice, in Payments</text><text class="mono warn" x="440.0" y="376.0" text-anchor="start">shipTo</text><text class="mono warn" x="500.0" y="376.0" text-anchor="start">≠</text><text class="mono" x="518.0" y="376.0" text-anchor="start">payer.address</text><text class="mono warn" x="440.0" y="406.0" text-anchor="start">pathEq Invoice [shipTo] [payer, address] = false</text><text class="note" x="440.0" y="426.0" text-anchor="start">Payments is acyclic, so false refutes PathEq</text><text class="note" x="440.0" y="441.0" text-anchor="start">(pathEq_iff_of_acyclic): the eqn clause fails.</text><text class="note" x="40.0" y="406.0" text-anchor="start">with billTo ↦ [payer, address] (ordersPayments)</text><text class="note" x="40.0" y="421.0" text-anchor="start">both sides go to payer.address: the clause holds.</text></svg>
