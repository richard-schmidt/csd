<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" role="img" aria-label="Restriction is contravariant: the pushout of schema categories becomes a correspondence between states of the glued schema and pairs of states that agree on the kernel."><style>svg { --surface: #ffffff; --region: #f3f5f8; --fg: #1b232c; --muted: #5a6675; --line: #c9d1da; --accent: #17708f; --accentfill: rgba(23,112,143,0.10); --kern: #2f7a4b; --kernfill: rgba(47,122,75,0.10); --warn: #b4421b; --warnfill: rgba(180,66,27,0.08); } @media (prefers-color-scheme: dark) { svg { --surface: #19212a; --region: #202a35; --fg: #e3e9ef; --muted: #9aa7b5; --line: #34414f; --accent: #5db4d3; --accentfill: rgba(93,180,211,0.14); --kern: #6cc28d; --kernfill: rgba(108,194,141,0.13); --warn: #f08c5e; --warnfill: rgba(240,140,94,0.11); } }
.bgr { fill: var(--surface); }
.n rect { fill: var(--surface); stroke: var(--fg); stroke-width: 1.2; }
.n.pl rect { fill: var(--accentfill); stroke: var(--accent); stroke-width: 1.5; }
.n.kern rect { fill: var(--kernfill); stroke: var(--kern); stroke-width: 1.5; }
.n.glued rect { fill: var(--kernfill); stroke: var(--kern); stroke-width: 1.5; }
.n.muted rect { fill: var(--surface); stroke: var(--muted); stroke-dasharray: 4 3; }
.n.warn rect { fill: var(--warnfill); stroke: var(--warn); stroke-width: 1.5; stroke-dasharray: 4 3; }
.n.val rect { fill: var(--region); stroke: var(--muted); }
.n.chip rect { fill: var(--surface); stroke: var(--muted); }
.n.chip.s rect { fill: var(--accentfill); stroke: var(--accent); }
.n.dot rect { fill: var(--region); stroke: var(--muted); }
.n .t { fill: var(--fg); font: 500 12.5px 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; }
.n .s { fill: var(--muted); font: 400 10.5px 'IBM Plex Mono', ui-monospace, Menlo, monospace; }
.n .a { fill: var(--fg); font: 400 10.5px 'IBM Plex Mono', ui-monospace, Menlo, monospace; }
.n.chip .t, .n.val .t, .n.dot .t { font: 400 11.5px 'IBM Plex Mono', ui-monospace, Menlo, monospace; }
.n .hr { stroke: var(--line); stroke-width: 1; }
.badge { font: 500 10px 'IBM Plex Mono', ui-monospace, Menlo, monospace; }
.b-pl { fill: var(--accent); } .b-kern { fill: var(--kern); } .b-warn { fill: var(--warn); }
.b-muted { fill: var(--muted); }
.e { fill: none; stroke-width: 1.4; }
.e.acl { stroke: var(--fg); }
.e.muted { stroke: var(--muted); }
.e.incl { stroke: var(--accent); stroke-dasharray: 6 4; }
.e.kern { stroke: var(--kern); stroke-dasharray: 6 4; stroke-width: 1.6; }
.e.eq { stroke: var(--accent); stroke-width: 2.2; }
.e.warn { stroke: var(--warn); stroke-width: 1.8; }
.e.ghost { stroke: var(--warn); stroke-dasharray: 3 3; }
.e.uniq { stroke: var(--fg); stroke-dasharray: 3 3; }
.e.map { stroke: var(--accent); stroke-dasharray: 2 3; stroke-width: 1.3; }
.e.glued { stroke: var(--kern); stroke-width: 1.6; }
.mk-acl, .mk-uniq { fill: var(--fg); } .mk-muted { fill: var(--muted); }
.mk-incl, .mk-eq, .mk-map { fill: var(--accent); } .mk-kern, .mk-glued { fill: var(--kern); }
.mk-warn, .mk-ghost { fill: var(--warn); }
.lbg { fill: var(--surface); }
.lb { font: 400 10.5px 'IBM Plex Mono', ui-monospace, Menlo, monospace; }
.c-acl, .c-muted, .c-uniq { fill: var(--muted); } .c-fg { fill: var(--fg); }
.c-incl, .c-eq, .c-map, .c-pl { fill: var(--accent); }
.c-kern, .c-glued { fill: var(--kern); } .c-warn, .c-ghost { fill: var(--warn); }
.rg { fill: var(--region); stroke: var(--line); }
.rg.pl { fill: var(--accentfill); stroke: var(--accent); stroke-dasharray: 3 3; }
.rg.kern { fill: var(--kernfill); stroke: var(--kern); stroke-dasharray: 3 3; }
.rg.warn { fill: var(--warnfill); stroke: var(--warn); stroke-dasharray: 3 3; }
.rg.plain { fill: none; stroke: var(--line); }
.rgl { font: 500 10.5px 'IBM Plex Mono', ui-monospace, Menlo, monospace; fill: var(--muted); letter-spacing: 0.04em; }
.rgl.pl { fill: var(--accent); } .rgl.kern { fill: var(--kern); } .rgl.warn { fill: var(--warn); }
.hull { fill: none; stroke: var(--fg); stroke-dasharray: 2 3; stroke-width: 1; }
.hl { font: 500 10.5px 'IBM Plex Mono', ui-monospace, Menlo, monospace; fill: var(--fg); }
.note { font: 400 11px 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; fill: var(--muted); }
.note.fg { fill: var(--fg); }
.mono { font: 400 11px 'IBM Plex Mono', ui-monospace, Menlo, monospace; fill: var(--fg); }
.mono.m { fill: var(--muted); } .mono.acc { fill: var(--accent); } .mono.warn { fill: var(--warn); }
.mono.kern { fill: var(--kern); }
.br { fill: none; stroke: var(--muted); stroke-width: 1; }
.br.acc { stroke: var(--accent); }
</style><defs><marker id="data-gluing-acl" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-acl" d="M0,0 L10,5 L0,10 z"/></marker><marker id="data-gluing-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-muted" d="M0,0 L10,5 L0,10 z"/></marker><marker id="data-gluing-incl" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-incl" d="M0,0 L10,5 L0,10 z"/></marker><marker id="data-gluing-kern" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-kern" d="M0,0 L10,5 L0,10 z"/></marker><marker id="data-gluing-eq" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-eq" d="M0,0 L10,5 L0,10 z"/></marker><marker id="data-gluing-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-warn" d="M0,0 L10,5 L0,10 z"/></marker><marker id="data-gluing-ghost" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-ghost" d="M0,0 L10,5 L0,10 z"/></marker><marker id="data-gluing-uniq" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-uniq" d="M0,0 L10,5 L0,10 z"/></marker><marker id="data-gluing-map" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-map" d="M0,0 L10,5 L0,10 z"/></marker><marker id="data-gluing-glued" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-glued" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bgr" width="860" height="300"/><g class="n kern"><rect x="25.0" y="63.0" width="110" height="34" rx="5"/><text class="t" x="80.0" y="84.5" text-anchor="middle">Customers</text></g><g class="n "><rect x="235.0" y="63.0" width="110" height="34" rx="5"/><text class="t" x="290.0" y="84.5" text-anchor="middle">Orders</text></g><g class="n "><rect x="25.0" y="213.0" width="110" height="34" rx="5"/><text class="t" x="80.0" y="234.5" text-anchor="middle">Shipping</text></g><g class="n glued"><rect x="235.0" y="213.0" width="110" height="34" rx="5"/><text class="t" x="290.0" y="234.5" text-anchor="middle">glued</text></g><line class="e kern" x1="137.5" y1="80.0" x2="231.0" y2="80.0" marker-end="url(#data-gluing-kern)"/><line class="e kern" x1="80.0" y1="99.5" x2="80.0" y2="209.0" marker-end="url(#data-gluing-kern)"/><line class="e glued" x1="290.0" y1="99.5" x2="290.0" y2="209.0" marker-end="url(#data-gluing-glued)"/><line class="e glued" x1="137.5" y1="230.0" x2="231.0" y2="230.0" marker-end="url(#data-gluing-glued)"/><path class="br" d="M250,204 L250,190 L264,190"/><g class="n glued"><rect x="455.0" y="63.0" width="130" height="34" rx="5"/><text class="t" x="520.0" y="84.5" text-anchor="middle">State glued</text></g><g class="n "><rect x="695.0" y="63.0" width="130" height="34" rx="5"/><text class="t" x="760.0" y="84.5" text-anchor="middle">State Orders</text></g><g class="n "><rect x="455.0" y="213.0" width="130" height="34" rx="5"/><text class="t" x="520.0" y="234.5" text-anchor="middle">State Shipping</text></g><g class="n kern"><rect x="695.0" y="213.0" width="130" height="34" rx="5"/><text class="t" x="760.0" y="234.5" text-anchor="middle">State Customers</text></g><line class="e glued" x1="587.5" y1="80.0" x2="691.0" y2="80.0" marker-end="url(#data-gluing-glued)"/><line class="e glued" x1="520.0" y1="99.5" x2="520.0" y2="209.0" marker-end="url(#data-gluing-glued)"/><line class="e kern" x1="760.0" y1="99.5" x2="760.0" y2="209.0" marker-end="url(#data-gluing-kern)"/><line class="e kern" x1="587.5" y1="230.0" x2="691.0" y2="230.0" marker-end="url(#data-gluing-kern)"/><path class="br" d="M598,120 L612,120 L612,106"/><text class="rgl" x="20.0" y="26.0" text-anchor="start">schema categories: pushout in Cat</text><rect class="lbg" x="173.9" y="62.0" width="20.6" height="13" rx="2"/><text class="lb c-kern" x="184.2" y="72.5" text-anchor="middle">ι₁</text><rect class="lbg" x="55.4" y="145.2" width="20.6" height="13" rx="2"/><text class="lb c-kern" x="72.0" y="155.8" text-anchor="end">ι₂</text><rect class="lbg" x="294.0" y="145.2" width="26.9" height="13" rx="2"/><text class="lb c-glued" x="298.0" y="155.8" text-anchor="start">inl</text><rect class="lbg" x="170.8" y="230.0" width="26.9" height="13" rx="2"/><text class="lb c-glued" x="184.2" y="240.5" text-anchor="middle">inr</text><text class="rgl" x="470.0" y="26.0" text-anchor="start">states, Δ = precomposition: pullback of sets</text><rect class="lbg" x="619.5" y="62.0" width="39.5" height="13" rx="2"/><text class="lb c-glued" x="639.2" y="72.5" text-anchor="middle">Δ inl</text><rect class="lbg" x="476.5" y="145.2" width="39.5" height="13" rx="2"/><text class="lb c-glued" x="512.0" y="155.8" text-anchor="end">Δ inr</text><rect class="lbg" x="764.0" y="145.2" width="33.2" height="13" rx="2"/><text class="lb c-kern" x="768.0" y="155.8" text-anchor="start">Δ ι₁</text><rect class="lbg" x="622.6" y="230.0" width="33.2" height="13" rx="2"/><text class="lb c-kern" x="639.2" y="240.5" text-anchor="middle">Δ ι₂</text><text class="mono acc" x="640.0" y="155.0" text-anchor="middle">stateEquiv</text><text class="mono" x="640.0" y="170.0" text-anchor="middle">X ↦ (Δ inl X, Δ inr X)</text><text class="note" x="20.0" y="290.0" text-anchor="start">values: each state carries values v : X(v) ≃ K v; restriction keeps them, since translations fix value types</text></svg>
