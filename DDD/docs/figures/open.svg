t-anchor="start">through toDomains: Orders, Payments</text><text class="mono warn" x="596.0" y="354.0" text-anchor="start">no route OrdersPL → Customers,</text><text class="mono warn" x="596.0" y="370.0" text-anchor="start">both in the Orders domain</text><text class="mono warn" x="596.0" y="386.0" text-anchor="start">no route Payments → Catalog</text></svg>
