<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 280" width="820" height="280" role="img" aria-label="A rewrite replaces one side of an equation inside a path; the class of a path is computed in rounds of rewrites until a round adds nothing."><style>svg { --surface: #ffffff; --region: #f3f5f8; --fg: #1b232c; --muted: #5a6675; --line: #c9d1da; --accent: #17708f; --accentfill: rgba(23,112,143,0.10); --kern: #2f7a4b; --kernfill: rgba(47,122,75,0.10); --warn: #b4421b; --warnfill: rgba(180,66,27,0.08); } @media (prefers-color-scheme: dark) { svg { --surface: #19212a; --region: #202a35; --fg: #e3e9ef; --muted: #9aa7b5; --line: #34414f; --accent: #5db4d3; --accentfill: rgba(93,180,211,0.14); --kern: #6cc28d; --kernfill: rgba(108,194,141,0.13); --warn: #f08c5e; --warnfill: rgba(240,140,94,0.11); } }
.bgr { fill: var(--surface); }
.n rect { fill: var(--surface); stroke: var(--fg); stroke-width: 1.2; }
.n.pl rect { fill: var(--accentfill); stroke: var(--accent); stroke-width: 1.5; }
.n.kern rect { fill: var(--kernfill); stroke: var(--kern); stroke-width: 1.5; }
.n.glued rect { fill: var(--kernfill); stroke: var(--kern); stroke-width: 1.5; }
.n.muted rect { fill: var(--surface); stroke: var(--muted); stroke-dasharray: 4 3; }
.n.warn rect { fill: var(--warnfill); stroke: var(--warn); stroke-width: 1.5; stroke-dasharray: 4 3; }
.n.val rect { fill: var(--region); stroke: var(--muted); }
.n.chip rect { fill: var(--surface); stroke: var(--muted); }
.n.chip.s rect { fill: var(--accentfill); stroke: var(--accent); }
.n.dot rect { fill: var(--region); stroke: var(--muted); }
.n .t { fill: var(--fg); font: 500 12.5px 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; }
.n .s { fill: var(--muted); font: 400 10.5px 'IBM Plex Mono', ui-monospace, Menlo, monospace; }
.n .a { fill: var(--fg); font: 400 10.5px 'IBM Plex Mono', ui-monospace, Menlo, monospace; }
.n.chip .t, .n.val .t, .n.dot .t { font: 400 11.5px 'IBM Plex Mono', ui-monospace, Menlo, monospace; }
.n .hr { stroke: var(--line); stroke-width: 1; }
.badge { font: 500 10px 'IBM Plex Mono', ui-monospace, Menlo, monospace; }
.b-pl { fill: var(--accent); } .b-kern { fill: var(--kern); } .b-warn { fill: var(--warn); }
.b-muted { fill: var(--muted); }
.e { fill: none; stroke-width: 1.4; }
.e.acl { stroke: var(--fg); }
.e.muted { stroke: var(--muted); }
.e.incl { stroke: var(--accent); stroke-dasharray: 6 4; }
.e.kern { stroke: var(--kern); stroke-dasharray: 6 4; stroke-width: 1.6; }
.e.eq { stroke: var(--accent); stroke-width: 2.2; }
.e.warn { stroke: var(--warn); stroke-width: 1.8; }
.e.ghost { stroke: var(--warn); stroke-dasharray: 3 3; }
.e.uniq { stroke: var(--fg); stroke-dasharray: 3 3; }
.e.map { stroke: var(--accent); stroke-dasharray: 2 3; stroke-width: 1.3; }
.e.glued { stroke: var(--kern); stroke-width: 1.6; }
.mk-acl, .mk-uniq { fill: var(--fg); } .mk-muted { fill: var(--muted); }
.mk-incl, .mk-eq, .mk-map { fill: var(--accent); } .mk-kern, .mk-glued { fill: var(--kern); }
.mk-warn, .mk-ghost { fill: var(--warn); }
.lbg { fill: var(--surface); }
.lb { font: 400 10.5px 'IBM Plex Mono', ui-monospace, Menlo, monospace; }
.c-acl, .c-muted, .c-uniq { fill: var(--muted); } .c-fg { fill: var(--fg); }
.c-incl, .c-eq, .c-map, .c-pl { fill: var(--accent); }
.c-kern, .c-glued { fill: var(--kern); } .c-warn, .c-ghost { fill: var(--warn); }
.rg { fill: var(--region); stroke: var(--line); }
.rg.pl { fill: var(--accentfill); stroke: var(--accent); stroke-dasharray: 3 3; }
.rg.kern { fill: var(--kernfill); stroke: var(--kern); stroke-dasharray: 3 3; }
.rg.warn { fill: var(--warnfill); stroke: var(--warn); stroke-dasharray: 3 3; }
.rg.plain { fill: none; stroke: var(--line); }
.rgl { font: 500 10.5px 'IBM Plex Mono', ui-monospace, Menlo, monospace; fill: var(--muted); letter-spacing: 0.04em; }
.rgl.pl { fill: var(--accent); } .rgl.kern { fill: var(--kern); } .rgl.warn { fill: var(--warn); }
.hull { fill: none; stroke: var(--fg); stroke-dasharray: 2 3; stroke-width: 1; }
.hl { font: 500 10.5px 'IBM Plex Mono', ui-monospace, Menlo, monospace; fill: var(--fg); }
.note { font: 400 11px 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; fill: var(--muted); }
.note.fg { fill: var(--fg); }
.mono { font: 400 11px 'IBM Plex Mono', ui-monospace, Menlo, monospace; fill: var(--fg); }
.mono.m { fill: var(--muted); } .mono.acc { fill: var(--accent); } .mono.warn { fill: var(--warn); }
.mono.kern { fill: var(--kern); }
.br { fill: none; stroke: var(--muted); stroke-width: 1; }
.br.acc { stroke: var(--accent); }
</style><defs><marker id="rewriting-acl" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-acl" d="M0,0 L10,5 L0,10 z"/></marker><marker id="rewriting-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-muted" d="M0,0 L10,5 L0,10 z"/></marker><marker id="rewriting-incl" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-incl" d="M0,0 L10,5 L0,10 z"/></marker><marker id="rewriting-kern" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-kern" d="M0,0 L10,5 L0,10 z"/></marker><marker id="rewriting-eq" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-eq" d="M0,0 L10,5 L0,10 z"/></marker><marker id="rewriting-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-warn" d="M0,0 L10,5 L0,10 z"/></marker><marker id="rewriting-ghost" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-ghost" d="M0,0 L10,5 L0,10 z"/></marker><marker id="rewriting-uniq" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-uniq" d="M0,0 L10,5 L0,10 z"/></marker><marker id="rewriting-map" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-map" d="M0,0 L10,5 L0,10 z"/></marker><marker id="rewriting-glued" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-glued" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bgr" width="820" height="280"/><rect class="rg " x="470" y="24" width="330" height="226" rx="8"/><text class="rgl " x="480" y="41">classOf OrderLine [order, billTo, city]</text><g class="n chip"><rect x="40.0" y="58.0" width="50.5" height="24" rx="5"/><text class="t" x="65.2" y="74.5" text-anchor="middle">order</text></g><g class="n chip s"><rect x="96.5" y="58.0" width="57.4" height="24" rx="5"/><text class="t" x="125.2" y="74.5" text-anchor="middle">billTo</text></g><g class="n chip"><rect x="159.9" y="58.0" width="43.6" height="24" rx="5"/><text class="t" x="181.7" y="74.5" text-anchor="middle">city</text></g><path class="br " d="M40.0,86.0 L40.0,92.0 L90.5,92.0 L90.5,86.0"/><path class="br acc" d="M96.5,86.0 L96.5,92.0 L153.9,92.0 L153.9,86.0"/><path class="br " d="M159.9,86.0 L159.9,92.0 L203.5,92.0 L203.5,86.0"/><g class="n chip"><rect x="40.0" y="178.0" width="50.5" height="24" rx="5"/><text class="t" x="65.2" y="194.5" text-anchor="middle">order</text></g><g class="n chip s"><rect x="96.5" y="178.0" width="71.2" height="24" rx="5"/><text class="t" x="132.1" y="194.5" text-anchor="middle">customer</text></g><g class="n chip s"><rect x="173.7" y="178.0" width="64.3" height="24" rx="5"/><text class="t" x="205.8" y="194.5" text-anchor="middle">address</text></g><g class="n chip"><rect x="244.0" y="178.0" width="43.6" height="24" rx="5"/><text class="t" x="265.8" y="194.5" text-anchor="middle">city</text></g><path class="br " d="M40.0,206.0 L40.0,212.0 L90.5,212.0 L90.5,206.0"/><path class="br acc" d="M96.5,206.0 L96.5,212.0 L238.0,212.0 L238.0,206.0"/><path class="br " d="M244.0,206.0 L244.0,212.0 L287.6,212.0 L287.6,206.0"/><line class="e eq" x1="150.0" y1="118.0" x2="150.0" y2="172.0" marker-end="url(#rewriting-eq)"/><line class="e eq" x1="170.0" y1="172.0" x2="170.0" y2="118.0" marker-end="url(#rewriting-eq)"/><text class="rgl" x="24.0" y="30.0" text-anchor="start">paths out of OrderLine, in Orders</text><text class="mono m" x="65.2" y="106.0" text-anchor="middle">u</text><text class="mono acc" x="125.2" y="106.0" text-anchor="middle">s.1 = [billTo]</text><text class="mono m" x="181.7" y="106.0" text-anchor="middle">v</text><text class="mono m" x="65.2" y="226.0" text-anchor="middle">u</text><text class="mono acc" x="167.2" y="226.0" text-anchor="middle">s.2 = [customer, address]</text><text class="mono m" x="265.8" y="226.0" text-anchor="middle">v</text><text class="note fg" x="186.0" y="140.0" text-anchor="start">Rewrite: tgt? OrderLine u = Order, the source of</text><text class="note fg" x="186.0" y="155.0" text-anchor="start">the equation billTo = customer.address</text><text class="mono m" x="486.0" y="64.0" text-anchor="start">round 0</text><text class="mono" x="546.0" y="64.0" text-anchor="start">order.billTo.city</text><text class="mono m" x="486.0" y="94.0" text-anchor="start">round 1</text><text class="mono acc" x="546.0" y="94.0" text-anchor="start">+ order.customer.address.city</text><text class="mono m" x="486.0" y="124.0" text-anchor="start">round 2</text><text class="mono" x="546.0" y="124.0" text-anchor="start">no new path: the class is closed</text><text class="note" x="486.0" y="172.0" text-anchor="start">candidates: paths of at most n generators,</text><text class="note" x="486.0" y="187.0" text-anchor="start">n = number of entity types (Acyclic)</text><text class="mono" x="486.0" y="222.0" text-anchor="start">pathEqAcyclic o l l&#x27; := l&#x27; ∈ classOf o l</text></svg>
