<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" width="940" height="300" role="img" aria-label="The next steps in order, left to right, with the dependencies between them."><style>svg { --surface: #ffffff; --region: #f3f5f8; --fg: #1b232c; --muted: #5a6675; --line: #c9d1da; --accent: #17708f; --accentfill: rgba(23,112,143,0.10); --kern: #2f7a4b; --kernfill: rgba(47,122,75,0.10); --warn: #b4421b; --warnfill: rgba(180,66,27,0.08); } @media (prefers-color-scheme: dark) { svg { --surface: #19212a; --region: #202a35; --fg: #e3e9ef; --muted: #9aa7b5; --line: #34414f; --accent: #5db4d3; --accentfill: rgba(93,180,211,0.14); --kern: #6cc28d; --kernfill: rgba(108,194,141,0.13); --warn: #f08c5e; --warnfill: rgba(240,140,94,0.11); } }
.bgr { fill: var(--surface); }
.n rect { fill: var(--surface); stroke: var(--fg); stroke-width: 1.2; }
.n.pl rect { fill: var(--accentfill); stroke: var(--accent); stroke-width: 1.5; }
.n.kern rect { fill: var(--kernfill); stroke: var(--kern); stroke-width: 1.5; }
.n.glued rect { fill: var(--kernfill); stroke: var(--kern); stroke-width: 1.5; }
.n.muted rect { fill: var(--surface); stroke: var(--muted); stroke-dasharray: 4 3; }
.n.warn rect { fill: var(--warnfill); stroke: var(--warn); stroke-width: 1.5; stroke-dasharray: 4 3; }
.n.val rect { fill: var(--region); stroke: var(--muted); }
.n.chip rect { fill: var(--surface); stroke: var(--muted); }
.n.chip.s rect { fill: var(--accentfill); stroke: var(--accent); }
.n.dot rect { fill: var(--region); stroke: var(--muted); }
.n .t { fill: var(--fg); font: 500 12.5px 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; }
.n .s { fill: var(--muted); font: 400 10.5px 'IBM Plex Mono', ui-monospace, Menlo, monospace; }
.n .a { fill: var(--fg); font: 400 10.5px 'IBM Plex Mono', ui-monospace, Menlo, monospace; }
.n.chip .t, .n.val .t, .n.dot .t { font: 400 11.5px 'IBM Plex Mono', ui-monospace, Menlo, monospace; }
.n .hr { stroke: var(--line); stroke-width: 1; }
.badge { font: 500 10px 'IBM Plex Mono', ui-monospace, Menlo, monospace; }
.b-pl { fill: var(--accent); } .b-kern { fill: var(--kern); } .b-warn { fill: var(--warn); }
.b-muted { fill: var(--muted); }
.e { fill: none; stroke-width: 1.4; }
.e.acl { stroke: var(--fg); }
.e.muted { stroke: var(--muted); }
.e.incl { stroke: var(--accent); stroke-dasharray: 6 4; }
.e.kern { stroke: var(--kern); stroke-dasharray: 6 4; stroke-width: 1.6; }
.e.eq { stroke: var(--accent); stroke-width: 2.2; }
.e.warn { stroke: var(--warn); stroke-width: 1.8; }
.e.ghost { stroke: var(--warn); stroke-dasharray: 3 3; }
.e.uniq { stroke: var(--fg); stroke-dasharray: 3 3; }
.e.map { stroke: var(--accent); stroke-dasharray: 2 3; stroke-width: 1.3; }
.e.glued { stroke: var(--kern); stroke-width: 1.6; }
.mk-acl, .mk-uniq { fill: var(--fg); } .mk-muted { fill: var(--muted); }
.mk-incl, .mk-eq, .mk-map { fill: var(--accent); } .mk-kern, .mk-glued { fill: var(--kern); }
.mk-warn, .mk-ghost { fill: var(--warn); }
.lbg { fill: var(--surface); }
.lb { font: 400 10.5px 'IBM Plex Mono', ui-monospace, Menlo, monospace; }
.c-acl, .c-muted, .c-uniq { fill: var(--muted); } .c-fg { fill: var(--fg); }
.c-incl, .c-eq, .c-map, .c-pl { fill: var(--accent); }
.c-kern, .c-glued { fill: var(--kern); } .c-warn, .c-ghost { fill: var(--warn); }
.rg { fill: var(--region); stroke: var(--line); }
.rg.pl { fill: var(--accentfill); stroke: var(--accent); stroke-dasharray: 3 3; }
.rg.kern { fill: var(--kernfill); stroke: var(--kern); stroke-dasharray: 3 3; }
.rg.warn { fill: var(--warnfill); stroke: var(--warn); stroke-dasharray: 3 3; }
.rg.plain { fill: none; stroke: var(--line); }
.rgl { font: 500 10.5px 'IBM Plex Mono', ui-monospace, Menlo, monospace; fill: var(--muted); letter-spacing: 0.04em; }
.rgl.pl { fill: var(--accent); } .rgl.kern { fill: var(--kern); } .rgl.warn { fill: var(--warn); }
.hull { fill: none; stroke: var(--fg); stroke-dasharray: 2 3; stroke-width: 1; }
.hl { font: 500 10.5px 'IBM Plex Mono', ui-monospace, Menlo, monospace; fill: var(--fg); }
.note { font: 400 11px 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; fill: var(--muted); }
.note.fg { fill: var(--fg); }
.mono { font: 400 11px 'IBM Plex Mono', ui-monospace, Menlo, monospace; fill: var(--fg); }
.mono.m { fill: var(--muted); } .mono.acc { fill: var(--accent); } .mono.warn { fill: var(--warn); }
.mono.kern { fill: var(--kern); }
.br { fill: none; stroke: var(--muted); stroke-width: 1; }
.br.acc { stroke: var(--accent); }
</style><defs><marker id="next-steps-acl" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-acl" d="M0,0 L10,5 L0,10 z"/></marker><marker id="next-steps-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-muted" d="M0,0 L10,5 L0,10 z"/></marker><marker id="next-steps-incl" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-incl" d="M0,0 L10,5 L0,10 z"/></marker><marker id="next-steps-kern" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-kern" d="M0,0 L10,5 L0,10 z"/></marker><marker id="next-steps-eq" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-eq" d="M0,0 L10,5 L0,10 z"/></marker><marker id="next-steps-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-warn" d="M0,0 L10,5 L0,10 z"/></marker><marker id="next-steps-ghost" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-ghost" d="M0,0 L10,5 L0,10 z"/></marker><marker id="next-steps-uniq" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-uniq" d="M0,0 L10,5 L0,10 z"/></marker><marker id="next-steps-map" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-map" d="M0,0 L10,5 L0,10 z"/></marker><marker id="next-steps-glued" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-glued" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bgr" width="940" height="300"/><path class="e muted" d="M120.0,23.0 L910.0,23.0" marker-end="url(#next-steps-muted)"/><g class="n "><rect x="9.0" y="98.0" width="152" height="44" rx="5"/><text class="t" x="85.0" y="117.0" text-anchor="middle">1. Coherence by check</text><text class="s" x="85.0" y="132.0" text-anchor="middle">Translation.comp</text></g><g class="n pl"><rect x="200.0" y="98.0" width="150" height="44" rx="5"/><text class="t" x="275.0" y="117.0" text-anchor="middle">2. Phase 4</text><text class="s" x="275.0" y="132.0" text-anchor="middle">JSON, certificates</text></g><g class="n "><rect x="390.0" y="98.0" width="150" height="44" rx="5"/><text class="t" x="465.0" y="117.0" text-anchor="middle">3. Several inclusions</text><text class="s" x="465.0" y="132.0" text-anchor="middle">n-ary gluing</text></g><g class="n "><rect x="580.0" y="98.0" width="150" height="44" rx="5"/><text class="t" x="655.0" y="117.0" text-anchor="middle">4. Attributed states</text><text class="s" x="655.0" y="132.0" text-anchor="middle">limits, colimits, Σ</text></g><g class="n kern"><rect x="770.0" y="98.0" width="150" height="44" rx="5"/><text class="t" x="845.0" y="117.0" text-anchor="middle">5. Phase 5</text><text class="s" x="845.0" y="132.0" text-anchor="middle">open systems</text></g><path class="e acl" d="M163.5,98.5 Q275.0,68.0 386.0,98.4" marker-end="url(#next-steps-acl)"/><path class="e acl" d="M542.5,141.2 Q655.0,172.0 766.0,141.6" marker-end="url(#next-steps-acl)"/><line class="e acl" x1="732.5" y1="120.0" x2="766.0" y2="120.0" marker-end="url(#next-steps-acl)"/><g class="n muted"><rect x="205.0" y="230.0" width="190" height="40" rx="5"/><text class="t" x="300.0" y="247.0" text-anchor="middle">names as indices</text><text class="s" x="300.0" y="262.0" text-anchor="middle">if checks exceed CI time</text></g><g class="n muted"><rect x="450.0" y="230.0" width="260" height="40" rx="5"/><text class="t" x="580.0" y="247.0" text-anchor="middle">rewriting certificates</text><text class="s" x="580.0" y="262.0" text-anchor="middle">if a model has cycles and equations</text></g><text class="rgl" x="24.0" y="28.0" text-anchor="start">order of work</text><rect class="lbg" x="201.6" y="64.2" width="146.6" height="13" rx="2"/><text class="lb c-acl" x="274.9" y="74.7" text-anchor="middle">composite translations</text><rect class="lbg" x="578.2" y="157.7" width="152.9" height="13" rx="2"/><text class="lb c-acl" x="654.6" y="168.2" text-anchor="middle">gluing along interfaces</text><rect class="lbg" x="726.4" y="99.0" width="45.8" height="13" rx="2"/><text class="lb c-acl" x="749.2" y="109.5" text-anchor="middle">states</text><text class="rgl" x="24.0" y="254.0" text-anchor="start">conditional</text></svg>
