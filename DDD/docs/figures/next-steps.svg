/><g class="n "><rect x="9.0" y="98.0" width="152" height="44" rx="5"/><text class="t" x="85.0" y="117.0" text-anchor="middle">1. Coherence by check</text><text class="s" x="85.0" y="132.0" text-anchor="middle">Translation.comp</text></g><g class="n pl"><rect x="180.0" y="98.0" width="150" height="44" rx="5"/><text class="t" x="255.0" y="117.0" text-anchor="middle">2. Phase 4</text><text class="s" x="255.0" y="132.0" text-anchor="middle">JSON, certificates</text></g><g class="n "><rect x="350.0" y="98.0" width="150" height="44" rx="5"/><text class="t" x="425.0" y="117.0" text-anchor="middle">3. Several inclusions</text><text class="s" x="425.0" y="132.0" text-anchor="middle">n-ary gluing</text></g><g class="n "><rect x="520.0" y="98.0" width="150" height="44" rx="5"/><text class="t" x="595.0" y="117.0" text-anchor="middle">4. Attributed states</text><text class="s" x="595.0" y="132.0" text-anchor="middle">limits, colimits, Σ</text></g><g class="n kern"><rect x="690.0" y="98.0" width="150" height="44" rx="5"/><text class="t" x="765.0" y="117.0" text-anchor="middle">5. Phase 5</text><text class="s" x="765.0" y="132.0" text-anchor="middle">open systems</text></g><g class="n "><rect x="870.0" y="98.0" width="150" height="44" rx="5"/><text class="t" x="945.0" y="117.0" text-anchor="middle">6. Aggregates</text><text class="s" x="945.0" y="132.0" text-anchor="middle">aggregate machines</text></g><path class="e acl" d="M163.5,96.0 Q255.0,68.0 346.0,95.8" marker-end="url(#next-steps-acl)"/><path class="e acl" d="M332.5,140.7 Q510.0,188.0 686.0,141.1" marker-end="url(#next-steps-acl)"/><line class="e acl" x1="672.5" y1="120.0" x2="686.0" y2="120.0" marker-end="url(#next-steps-acl)"/><line class="e acl" x1="842.5" y1="120.0" x2="866.0" y2="120.0" marker-end="url(#next-steps-acl)"/><path class="e acl" d="M502.5,99.7 Q685.0,52.0 866.0,99.3" marker-end="url(#next-steps-acl)"/><g class="n muted"><rect x="205.0" y="230.0" width="190" height="40" rx="5"/><text class="t" x="300.0" y=