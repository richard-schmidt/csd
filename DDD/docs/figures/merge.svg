.0" width="120" height="34" rx="5"/><text class="t" x="840.0" y="84.5" text-anchor="middle">OrdersPL</text></g><g class="n "><rect x="520.0" y="233.0" width="120" height="34" rx="5"/><text class="t" x="580.0" y="254.5" text-anchor="middle">Catalog</text></g><g class="n glued"><rect x="690.0" y="230.0" width="150" height="40" rx="5"/><text class="t" x="765.0" y="247.0" text-anchor="middle">glued</text><text class="s" x="765.0" y="262.0" text-anchor="middle">13 entity types</text></g><line class="e incl" x1="580.0" y1="99.5" x2="580.0" y2="229.0" marker-end="url(#merge-incl)"/><line class="e acl" x1="601.2" y1="99.5" x2="738.9" y2="226.0" marker-end="url(#merge-acl)"/><path class="e incl" d="M817.5,99.5 Q762.2,147.2 764.4,226.0" marker-end="url(#merge-incl)"/><path class="e acl" d="M840.5,99.5 Q842.8,182.8 792.8,226.0" marker-end="url(#merge-acl)"/><text class="mono" x="36.0" y="300.0" text-anchor="start">Shipping shares Customer, Address with Orders through Customers</text><text class="mono" x="36.0" y="314.0" text-anchor="start">Payments shares Address with Orders through Addresses</text><rect class="lbg" x="527.3" y="148.8" width="64.7" height="13" rx="2"/><text class="lb c-incl" x="588.0" y="159.3" text-anchor="end">inclusion</text><rect class="lbg" x="634.9" y="176.3" width="89.9" height="13" rx="2"/><text class="lb c-acl" x="679.8" y="186.8" text-anchor="middle">catalogOrders</text><rect class="lbg" x="705.1" y="136.5" width="71.0" height="13" rx="2"/><text class="lb c-incl" x="772.1" y="147.0" text-anchor="end">via Orders</text><rect class="lbg" x="835.3" y="160.6" width="83.6" height="13" rx="2"/><text class="lb c-acl" x="839.3" y="171.1" text-anchor="start">via Payments</text><text class="mono" x="24.0" y="350.0" text-anchor="start">glued = glueAll [Orders, Shipping, Payments, Customers, Addresses]</text><text class="mono m" x="24.0" y="368.0" text-anchor="start">isColimit: the glued schema category is the colimit of D restricted to the component</text><text class="note" x="24.0" y="386.0" text-anchor="start">an arrow into a member goes to glued, its translation composed with the leg of the member (diagram_into)</text><text class="note" x="24.0" y="404.0" text-anchor="start">every leg fully faithful; the merged map has no cycle, so lax non-interference holds for its four contexts</text></svg>
