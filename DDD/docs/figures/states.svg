 class="rg " x="480" y="24" width="440" height="310" rx="8"/><text class="rgl " x="490" y="41">Σ ALONG A TRANSLATION</text><g class="n kern"><rect x="35.0" y="63.0" width="170" height="58" rx="5"/><text class="t" x="120.0" y="80.0" text-anchor="middle">Z, shared</text><line class="hr" x1="35.0" y1="87.0" x2="205.0" y2="87.0"/><text class="a" x="43.0" y="101.0">Customer: ada</text><text class="a" x="43.0" y="115.0">string ≃ K string</text></g><g class="n "><rect x="260.0" y="63.0" width="170" height="58" rx="5"/><text class="t" x="345.0" y="80.0" text-anchor="middle">X</text><line class="hr" x1="260.0" y1="87.0" x2="430.0" y2="87.0"/><text class="a" x="268.0" y="101.0">Customer: ada, bo</text><text class="a" x="268.0" y="115.0">string ≃ K string</text></g><g class="n "><rect x="35.0" y="203.0" width="170" height="58" rx="5"/><text class="t" x="120.0" y="220.0" text-anchor="middle">Y</text><line class="hr" x1="35.0" y1="227.0" x2="205.0" y2="227.0"/><text class="a" x="43.0" y="241.0">Customer: ada, cy</text><text class="a" x="43.0" y="255.0">string ≃ K string</text></g><g class="n glued"><rect x="260.0" y="203.0" width="170" height="58" rx="5"/><text class="t" x="345.0" y="220.0" text-anchor="middle">pushout</text><line class="hr" x1="260.0" y1="227.0" x2="430.0" y2="227.0"/><text class="a" x="268.0" y="241.0">Customer: ada, bo, cy</text><text class="a" x="268.0" y="255.0">string ≃ K string</text></g><line class="e kern" x1="207.5" y1="92.0" x2="256.0" y2="92.0" marker-end="url(#states-kern)"/><line class="e kern" x1="120.0" y1="123.5" x2="120.0" y2="199.0" marker-end="url(#states-kern)"/><line class="e glued" x1="345.0" y1="123.5" x2="345.0" y2="199.0" marker-end="url(#states-glued)"/><line class="e glued" x1="207.5" y1="232.0" x2="256.0" y2="232.0" marker-end="url(#states-glued)"/><path class="br" d="M274,190 L274,176 L288,176"/><g class="n kern"><rect x="490.0" y="64.0" width="160" height="72" rx="5"/><text class="t" x="570.0" y="81.0" text-anchor="middle">Customer · Customers</text><line class="hr" x1="490.0" y1="88.0" x2="650.0" y2="88.0"/><text class="a" x="498.0" y="102.0">name</text><text class="a" x="498.0" y="116.0">address.street</text><text class="a" x="498.0" y="130.0">address.city</text></g><g class="n "><rect x="750.0" y="64.0" width="160" height="72" rx="5"/><text class="t" x="830.0" y="81.0" text-anchor="middle">Customer · Orders</text><line class="hr" x1="750.0" y1="88.0" x2="910.0" y2="88.0"/><text class="a" x="758.0" y="102.0">name</text><text class="a" x="758.0" y="116.0">address.street</text><text class="a" x="758.0" y="130.0">address.city</text></g><line class="e kern" x1="652.5" y1="100.0" x2="746.0" y2="100.0" marker-end="url(#states-kern)"/><g class="n pl"><rect x="490.0" y="202.0" width="160" height="72" rx="5"/><text class="t" x="570.0" y="219.0" text-anchor="middle">Order · OrdersPL</text><line class="hr" x1="490.0" y1="226.0" x2="650.0" y2="226.0"/><text class="a" x="498.0" y="240.0">id, placedOn</text><text class="a" x="498.0" y="254.0">customer.name, …</text><text class="a" x="498.0" y="268.0">billTo…, shipTo…</text></g><g class="n "><rect x="750.0" y="195.0" width="160" height="86" rx="5"/><text class="t" x="830.0" y="212.0" text-anchor="middle">Order · Orders</text><line class="hr" x1="750.0" y1="219.0" x2="910.0" y2="219.0"/><text class="a" x="758.0" y="233.0">id, placedOn</text><text class="a" x="758.0" y="247.0">customer.name, …</text><text class="a" x="758.0" y="261.0">billTo…, shipTo…</text><text class="a" x="758.0" y="275.0">status</text></g><line class="e incl" x1="652.5" y1="238.0" x2="746.0" y2="238.0" marker-end="url(#states-incl)"/><text class="mono" x="36.0" y="292.0" text-anchor="start">entity types: the pushout of sets</text><text class="mono" x="36.0" y="308.0" text-anchor="start">value types: K v again, not K v ⊔ K v</text><text class="mono m" x="36.0" y="324.0" text-anchor="start">limits: compatible families with one profile</text><rect class="lbg" x="666.9" y="82.0" width="64.7" height="13" rx="2"/><text class="lb c-kern" x="699.2" y="92.5" text-anchor="middle">inclusion</text><text class="mono kern" x="700.0" y="158.0" text-anchor="middle">bijective into value types: Σ exists</text><rect class="lbg" x="666.9" y="220.0" width="64.7" height="13" rx="2"/><text class="lb c-incl" x="699.2" y="230.5" text-anchor="middle">inclusion</text><text class="mono warn" x="700.0" y="306.0" text-anchor="middle">status has no source path: no Σ</text><text class="note" x="24.0" y="356.0" text-anchor="start">isRightAdjoint_restrictStateFunctor_iff: Δ_T on attributed states has a left adjoint exactly when T is bijective</text><text class="note" x="24.0" y="372.0" text-anchor="start">on paths into value types, when each K v has two values; checkFullyFaithful passing implies the condition</text></svg>
