<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" width="940" height="540" role="img" aria-label="The aggregate schemas of Orders hold the roots they refer to as identities; a compatible family of their states that satisfies the equations across aggregates is a state of Orders. A step of one aggregate passes its own check, and the context reports the rules across aggregates that it breaks."><style>svg { --surface: #ffffff; --region: #f3f5f8; --fg: #1b232c; --muted: #5a6675; --line: #c9d1da; --accent: #17708f; --accentfill: rgba(23,112,143,0.10); --kern: #2f7a4b; --kernfill: rgba(47,122,75,0.10); --warn: #b4421b; --warnfill: rgba(180,66,27,0.08); } @media (prefers-color-scheme: dark) { svg { --surface: #19212a; --region: #202a35; --fg: #e3e9ef; --muted: #9aa7b5; --line: #34414f; --accent: #5db4d3; --accentfill: rgba(93,180,211,0.14); --kern: #6cc28d; --kernfill: rgba(108,194,141,0.13); --warn: #f08c5e; --warnfill: rgba(240,140,94,0.11); } }
.bgr { fill: var(--surface); }
.n rect { fill: var(--surface); stroke: var(--fg); stroke-width: 1.2; }
.n.pl rect { fill: var(--accentfill); stroke: var(--accent); stroke-width: 1.5; }
.n.kern rect { fill: var(--kernfill); stroke: var(--kern); stroke-width: 1.5; }
.n.glued rect { fill: var(--kernfill); stroke: var(--kern); stroke-width: 1.5; }
.n.muted rect { fill: var(--surface); stroke: var(--muted); stroke-dasharray: 4 3; }
.n.warn rect { fill: var(--warnfill); stroke: var(--warn); stroke-width: 1.5; stroke-dasharray: 4 3; }
.n.val rect { fill: var(--region); stroke: var(--muted); }
.n.chip rect { fill: var(--surface); stroke: var(--muted); }
.n.chip.s rect { fill: var(--accentfill); stroke: var(--accent); }
.n.dot rect { fill: var(--region); stroke: var(--muted); }
.n .t { fill: var(--fg); font: 500 12.5px 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; }
.n .s { fill: var(--muted); font: 400 10.5px 'IBM Plex Mono', ui-monospace, Menlo, monospace; }
.n .a { fill: var(--fg); font: 400 10.5px 'IBM Plex Mono', ui-monospace, Menlo, monospace; }
.n.chip .t, .n.val .t, .n.dot .t { font: 400 11.5px 'IBM Plex Mono', ui-monospace, Menlo, monospace; }
.n .hr { stroke: var(--line); stroke-width: 1; }
.badge { font: 500 10px 'IBM Plex Mono', ui-monospace, Menlo, monospace; }
.b-pl { fill: var(--accent); } .b-kern { fill: var(--kern); } .b-warn { fill: var(--warn); }
.b-muted { fill: var(--muted); }
.e { fill: none; stroke-width: 1.4; }
.e.acl { stroke: var(--fg); }
.e.muted { stroke: var(--muted); }
.e.incl { stroke: var(--accent); stroke-dasharray: 6 4; }
.e.kern { stroke: var(--kern); stroke-dasharray: 6 4; stroke-width: 1.6; }
.e.eq { stroke: var(--accent); stroke-width: 2.2; }
.e.warn { stroke: var(--warn); stroke-width: 1.8; }
.e.ghost { stroke: var(--warn); stroke-dasharray: 3 3; }
.e.uniq { stroke: var(--fg); stroke-dasharray: 3 3; }
.e.map { stroke: var(--accent); stroke-dasharray: 2 3; stroke-width: 1.3; }
.e.glued { stroke: var(--kern); stroke-width: 1.6; }
.mk-acl, .mk-uniq { fill: var(--fg); } .mk-muted { fill: var(--muted); }
.mk-incl, .mk-eq, .mk-map { fill: var(--accent); } .mk-kern, .mk-glued { fill: var(--kern); }
.mk-warn, .mk-ghost { fill: var(--warn); }
.lbg { fill: var(--surface); }
.lb { font: 400 10.5px 'IBM Plex Mono', ui-monospace, Menlo, monospace; }
.c-acl, .c-muted, .c-uniq { fill: var(--muted); } .c-fg { fill: var(--fg); }
.c-incl, .c-eq, .c-map, .c-pl { fill: var(--accent); }
.c-kern, .c-glued { fill: var(--kern); } .c-warn, .c-ghost { fill: var(--warn); }
.rg { fill: var(--region); stroke: var(--line); }
.rg.pl { fill: var(--accentfill); stroke: var(--accent); stroke-dasharray: 3 3; }
.rg.kern { fill: var(--kernfill); stroke: var(--kern); stroke-dasharray: 3 3; }
.rg.warn { fill: var(--warnfill); stroke: var(--warn); stroke-dasharray: 3 3; }
.rg.plain { fill: none; stroke: var(--line); }
.rgl { font: 500 10.5px 'IBM Plex Mono', ui-monospace, Menlo, monospace; fill: var(--muted); letter-spacing: 0.04em; }
.rgl.pl { fill: var(--accent); } .rgl.kern { fill: var(--kern); } .rgl.warn { fill: var(--warn); }
.hull { fill: none; stroke: var(--fg); stroke-dasharray: 2 3; stroke-width: 1; }
.hl { font: 500 10.5px 'IBM Plex Mono', ui-monospace, Menlo, monospace; fill: var(--fg); }
.note { font: 400 11px 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; fill: var(--muted); }
.note.fg { fill: var(--fg); }
.mono { font: 400 11px 'IBM Plex Mono', ui-monospace, Menlo, monospace; fill: var(--fg); }
.mono.m { fill: var(--muted); } .mono.acc { fill: var(--accent); } .mono.warn { fill: var(--warn); }
.mono.kern { fill: var(--kern); }
.br { fill: none; stroke: var(--muted); stroke-width: 1; }
.br.acc { stroke: var(--accent); }
</style><defs><marker id="aggregates-acl" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-acl" d="M0,0 L10,5 L0,10 z"/></marker><marker id="aggregates-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-muted" d="M0,0 L10,5 L0,10 z"/></marker><marker id="aggregates-incl" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-incl" d="M0,0 L10,5 L0,10 z"/></marker><marker id="aggregates-kern" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-kern" d="M0,0 L10,5 L0,10 z"/></marker><marker id="aggregates-eq" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-eq" d="M0,0 L10,5 L0,10 z"/></marker><marker id="aggregates-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-warn" d="M0,0 L10,5 L0,10 z"/></marker><marker id="aggregates-ghost" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-ghost" d="M0,0 L10,5 L0,10 z"/></marker><marker id="aggregates-uniq" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-uniq" d="M0,0 L10,5 L0,10 z"/></marker><marker id="aggregates-map" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-map" d="M0,0 L10,5 L0,10 z"/></marker><marker id="aggregates-glued" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-glued" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bgr" width="940" height="540"/><rect class="rg " x="20" y="24" width="900" height="300" rx="8"/><text class="rgl " x="30" y="41">AGGREGATE SCHEMAS OF ORDERS</text><rect class="rg kern" x="36" y="50" width="200" height="176" rx="8"/><text class="rgl kern" x="46" y="67">CUSTOMER</text><rect class="rg kern" x="252" y="50" width="316" height="176" rx="8"/><text class="rgl kern" x="262" y="67">ORDER</text><rect class="rg kern" x="584" y="50" width="150" height="176" rx="8"/><text class="rgl kern" x="594" y="67">ADDRESS</text><rect class="rg kern" x="750" y="50" width="154" height="176" rx="8"/><text class="rgl kern" x="760" y="67">PRODUCT</text><rect class="rg " x="20" y="344" width="900" height="180" rx="8"/><text class="rgl " x="30" y="361">A MACHINE PER AGGREGATE</text><g class="n "><rect x="50.0" y="87.0" width="100" height="34" rx="5"/><text class="t" x="100.0" y="108.5" text-anchor="middle">Customer</text></g><g class="n muted"><rect x="122.0" y="171.0" width="96" height="30" rx="5"/><text class="t" x="170.0" y="190.5" text-anchor="middle">Address</text></g><line class="e acl" x1="116.6" y1="123.5" x2="153.8" y2="167.0" marker-end="url(#aggregates-acl)"/><g class="n "><rect x="280.0" y="87.0" width="100" height="34" rx="5"/><text class="t" x="330.0" y="108.5" text-anchor="middle">Order</text></g><g class="n "><rect x="280.0" y="169.0" width="100" height="34" rx="5"/><text class="t" x="330.0" y="190.5" text-anchor="middle">OrderLine</text></g><line class="e acl" x1="330.0" y1="166.5" x2="330.0" y2="125.0" marker-end="url(#aggregates-acl)"/><g class="n muted"><rect x="450.0" y="70.0" width="96" height="28" rx="5"/><text class="t" x="498.0" y="88.5" text-anchor="middle">Customer</text></g><g class="n muted"><rect x="450.0" y="118.0" width="96" height="28" rx="5"/><text class="t" x="498.0" y="136.5" text-anchor="middle">Address</text></g><g class="n muted"><rect x="450.0" y="172.0" width="96" height="28" rx="5"/><text class="t" x="498.0" y="190.5" text-anchor="middle">Product</text></g><line class="e acl" x1="382.5" y1="97.8" x2="446.0" y2="90.2" marker-end="url(#aggregates-acl)"/><line class="e acl" x1="382.5" y1="112.8" x2="446.0" y2="123.3" marker-end="url(#aggregates-acl)"/><line class="e acl" x1="382.5" y1="186.0" x2="446.0" y2="186.0" marker-end="url(#aggregates-acl)"/><g class="n "><rect x="604.0" y="112.0" width="110" height="40" rx="5"/><text class="t" x="659.0" y="129.0" text-anchor="middle">Address</text><text class="s" x="659.0" y="144.0" text-anchor="middle">value object</text></g><g class="n "><rect x="772.0" y="115.0" width="110" height="34" rx="5"/><text class="t" x="827.0" y="136.5" text-anchor="middle">Product</text></g><g class="n glued"><rect x="650.0" y="264.0" width="220" height="40" rx="5"/><text class="t" x="760.0" y="281.0" text-anchor="middle">a state of Orders</text><text class="s" x="760.0" y="296.0" text-anchor="middle">contextEquiv</text></g><g class="n "><rect x="45.0" y="390.0" width="170" height="40" rx="5"/><text class="t" x="130.0" y="407.0" text-anchor="middle">Ada, order o₁</text><text class="s" x="130.0" y="422.0" text-anchor="middle">report: none</text></g><g class="n glued"><rect x="370.0" y="390.0" width="200" height="40" rx="5"/><text class="t" x="470.0" y="407.0" text-anchor="middle">Customer: no one</text><text class="s" x="470.0" y="422.0" text-anchor="middle">its own check passes</text></g><g class="n warn"><rect x="690.0" y="390.0" width="200" height="40" rx="5"/><text class="t" x="790.0" y="407.0" text-anchor="middle">reported</text><text class="s" x="790.0" y="422.0" text-anchor="middle">not refused</text></g><line class="e acl" x1="217.5" y1="410.0" x2="366.0" y2="410.0" marker-end="url(#aggregates-acl)"/><line class="e warn" x1="572.5" y1="410.0" x2="686.0" y2="410.0" marker-end="url(#aggregates-warn)"/><rect class="lbg" x="137.3" y="131.1" width="52.1" height="13" rx="2"/><text class="lb c-acl" x="141.3" y="141.6" text-anchor="start">address</text><rect class="lbg" x="302.5" y="136.8" width="39.5" height="13" rx="2"/><text class="lb c-acl" x="338.0" y="147.2" text-anchor="end">order</text><text class="note" x="36.0" y="250.0" text-anchor="start">dashed: an identity, an entity type with no generators</text><text class="mono" x="36.0" y="274.0" text-anchor="start">equations across aggregates (orders_cross):</text><text class="mono warn" x="36.0" y="292.0" text-anchor="start">billTo = customer.address</text><text class="mono warn" x="250.0" y="292.0" text-anchor="start">sku = product.sku</text><text class="mono m" x="36.0" y="312.0" text-anchor="start">Payments: invoice = payment.invoice is internal to Payment</text><text class="mono acc" x="760.0" y="250.0" text-anchor="middle">compatible family + equations</text><rect class="lbg" x="256.2" y="391.0" width="71.0" height="13" rx="2"/><text class="lb c-acl" x="291.8" y="401.5" text-anchor="middle">remove Ada</text><rect class="lbg" x="612.6" y="391.0" width="33.2" height="13" rx="2"/><text class="lb c-warn" x="629.2" y="401.5" text-anchor="middle">glue</text><text class="mono warn" x="36.0" y="470.0" text-anchor="start">dangling Order.customer: order 0 refers to customer 0</text><text class="mono warn" x="36.0" y="488.0" text-anchor="start">eqn billTo = customer.address fails at order 0</text><text class="mono m" x="36.0" y="510.0" text-anchor="start">both rules across aggregates (contextMachine_across)</text><text class="mono" x="560.0" y="470.0" text-anchor="start">Ada&#x27;s address set to one the customer</text><text class="mono" x="560.0" y="488.0" text-anchor="start">aggregate does not hold: its own check</text><text class="mono" x="560.0" y="506.0" text-anchor="start">fails, and the step is refused</text></svg>
