name: csd-check on aarch64

# Builds the native csd-check on aarch64 Linux, checks the committed
# certificate with it, and uploads the stripped executable with the
# certificate and cli/measure_check.py, for the run on Android described in
# cli/android-test.md. The executable links glibc dynamically.

on:
  push:
    paths:
      - 'cli/**'
      - 'DDD/**'
      - '!DDD/docs/**'
      - '!**/*.md'
      - 'julia/out/certificate.json'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/csd_check_arm.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  csd-check-aarch64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          build-args: csd-check
      - name: Check the certificate and a false claim
        run: python3 cli/measure_check.py .lake/build/bin/csd-check julia/out/certificate.json
      - name: Strip the executable
        run: |
          mkdir dist
          strip -o dist/csd-check .lake/build/bin/csd-check
          dist/csd-check julia/out/certificate.json > /dev/null
          cp julia/out/certificate.json cli/measure_check.py dist/
          (cd dist && sha256sum csd-check certificate.json measure_check.py > SHA256SUMS)
          file dist/csd-check
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: csd-check-linux-aarch64
          path: dist/
          retention-days: 30
