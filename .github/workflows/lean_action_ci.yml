name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read # Read access to repository contents
  pages: write # Write access to GitHub Pages
  id-token: write # Write access to ID tokens

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      # API docs take ~30 min and deploy to GitHub Pages, which a private
      # repo cannot host: only on main, once the repository is public.
      - uses: leanprover-community/docgen-action@v1
        if: github.ref == 'refs/heads/main' && !github.event.repository.private
